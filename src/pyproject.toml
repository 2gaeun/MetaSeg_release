[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmetaseg-deploy"
version = "0.3.0"
description = "Standalone DICOM, bidirectional I2SB DA and Dataset510 pseudo-1mm two-channel segmentation"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["bms_deploy*"]

[tool.setuptools.package-data]
"bms_deploy._vendor" = ["LICENSE_I2SB"]
"bms_deploy._vendor.guided_diffusion" = ["LICENSE_GUIDED_DIFFUSION"]
